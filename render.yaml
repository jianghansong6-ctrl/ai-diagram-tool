services:
  - type: web
    name: ai-scientific-diagram
    runtime: python
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build && cd ..
      pip install -r backend/requirements.txt
    startCommand: python -m backend.main
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        value: https://api.deepseek.com
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
